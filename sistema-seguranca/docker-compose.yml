services:

  app:
    build: .
    container_name: sistema_seguranca_app

    ports:
      - "8080:80"

    volumes:
      - ./app:/var/www/html

    depends_on:
      - db

  db:
    image: postgres:15

    container_name: sistema_seguranca_db

    restart: always

    environment:
      POSTGRES_DB: seguranca
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: